<div class="page-container">
  <h2>Configuración General de Usuario</h2>

  @if (successMessage) {
    <div class="alert-success">{{ successMessage }}</div>
  }

  <section class="card-section">
    <h3>Ajustes Financieros Base</h3>
    <form [formGroup]="configForm" (ngSubmit)="saveConfig()">
      <div class="form-grid">
        <div class="form-group">
          <label>Frecuencia de Cobro</label>
          <select formControlName="payFrequency">
            <option value="quincenal">Quincenal</option>
            <option value="mensual">Mensual</option>
          </select>
        </div>

        <div class="form-group">
          <label>Sueldo Base (GTQ)</label>
          <input type="number" formControlName="baseSalary" min="0" step="0.01" />
        </div>

        <div class="form-group">
          <label>Ahorro Acumulado Inicial (GTQ)</label>
          <input type="number" formControlName="initialSavings" min="0" step="0.01" />
        </div>

        <div class="form-group">
          <label>Saldo minimo para lanzar Alerta (GTQ)</label>
          <input type="number" formControlName="balanceThreshold" min="0" step="0.01" placeholder="Ej. 200.00" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="configForm.invalid">
        Guardar Configuración
      </button>
    </form>
  </section>
</div>
